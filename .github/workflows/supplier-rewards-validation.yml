name: Supplier rewards validation
on:
  push:
    branches: [validation/1409-c52a]
permissions:
  contents: read
jobs:
  rewards:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      PROPTEST_CASES: 16
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stellar-lend
          cache-on-failure: true
      - name: New file formatting
        run: rustfmt --edition 2021 --check stellar-lend/contracts/lending/src/supplier_rewards.rs stellar-lend/contracts/lending/tests/supplier_rewards.rs
      - name: Supplier rewards tests
        if: always()
        run: cargo test --manifest-path stellar-lend/Cargo.toml -p stellarlend-lending --test supplier_rewards
      - name: Error registry tests
        if: always()
        run: cargo test --manifest-path stellar-lend/Cargo.toml -p stellarlend-errors
      - name: Lending integration suites
        if: always()
        run: SUITES=lending-integration bash scripts/testing/run-contract-tests.sh test
      - name: Install official Stellar CLI
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/stellar-cli"
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/stellar-cli.tar.gz"
          tar -xzf "$RUNNER_TEMP/stellar-cli.tar.gz" -C "$RUNNER_TEMP/stellar-cli"
          echo "$RUNNER_TEMP/stellar-cli" >> "$GITHUB_PATH"
      - name: Wasm build
        if: always()
        run: stellar contract build --manifest-path stellar-lend/contracts/lending/Cargo.toml
      - name: Checkout unchanged upstream baseline
        if: always()
        uses: actions/checkout@v4
        with:
          ref: 252708a1ffae7bf0e21e65541f1e8056703abddc
          path: baseline
      - name: Baseline event topics
        if: always()
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/stellar-lend/target
        run: cargo test --manifest-path baseline/stellar-lend/Cargo.toml -p stellarlend-lending --test event_topics
      - name: Baseline clippy
        if: always()
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/stellar-lend/target
        run: cargo clippy --manifest-path baseline/stellar-lend/Cargo.toml -p stellarlend-lending --lib -- -D warnings
      - name: Baseline workspace formatting
        if: always()
        run: cargo fmt --manifest-path baseline/stellar-lend/Cargo.toml --all -- --check
